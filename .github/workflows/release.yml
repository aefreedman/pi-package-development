name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish or reconcile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Trusted npm publication
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"

      - name: Verify release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          expected_git_head="$(git rev-parse HEAD)"

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::Release tag must be ${expected_tag}; received ${RELEASE_TAG}."
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "${expected_git_head}" ]]; then
            echo "::error::Release tag does not resolve to the checked-out commit."
            exit 1
          fi
          grep -F "## ${package_version} -" CHANGELOG.md
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null

          metadata_file="$(mktemp)"
          error_file="$(mktemp)"
          if npm view "${package_name}@${package_version}" version gitHead --json >"${metadata_file}" 2>"${error_file}"; then
            observed_version="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.version))" "${metadata_file}")"
            observed_git_head="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.gitHead))" "${metadata_file}")"
            rm -f "${metadata_file}" "${error_file}"
            if [[ "${observed_version}" != "${package_version}" || "${observed_git_head}" != "${expected_git_head}" ]]; then
              echo "::error::Existing npm identity does not match ${expected_tag}: version=${observed_version}, gitHead=${observed_git_head}, expectedGitHead=${expected_git_head}."
              exit 1
            fi
            echo "publish_required=false" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} already exists with the exact release gitHead."
            exit 0
          fi
          rm -f "${metadata_file}"
          if ! grep -q "E404" "${error_file}"; then
            echo "::error::Unable to verify whether ${package_name}@${package_version} exists on npm."
            cat "${error_file}"
            rm -f "${error_file}"
            exit 1
          fi
          rm -f "${error_file}"
          echo "publish_required=true" >> "${GITHUB_OUTPUT}"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test and validate package
        run: |
          npm test
          npm pack --dry-run

      - name: Dry-run unpublished package
        if: steps.identity.outputs.publish_required == 'true'
        run: npm publish --dry-run --access public --ignore-scripts

      - name: Publish with provenance through npm trusted publishing
        if: steps.identity.outputs.publish_required == 'true'
        run: npm publish --access public --provenance

      - name: Verify npm release identity
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_head="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5 6; do
            set +e
            published_head="$(npm view "${package_name}@${package_version}" gitHead 2>&1)"
            npm_status=$?
            set -e
            if [[ ${npm_status} -eq 0 ]]; then
              test "${published_head}" = "${expected_head}"
              exit 0
            fi
            if [[ ${published_head} =~ E404 ]] && [[ ${attempt} -lt 6 ]]; then
              sleep $((attempt * 5))
              continue
            fi
            printf '%s\n' "${published_head}" >&2
            exit "${npm_status}"
          done
